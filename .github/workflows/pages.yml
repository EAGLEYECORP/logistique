# Publie l'application sur GitHub Pages à chaque push sur la branche principale.
# Prérequis (une fois) : Settings → Pages → Source : « GitHub Actions ».
name: Publication GitHub Pages

on:
  push:
    branches: [ccr-9838cb49-guapr6]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  publication:
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet : date du dernier changement de chaque fichier
      - name: Préparer le site (fichiers de l'application uniquement)
        run: |
          # Date de chaque fichier = son dernier commit : un fichier inchangé garde la même étiquette (ETag) d'une publication
          # à l'autre et revient « inchangé » au lieu d'être retéléchargé.
          git ls-files -z | while IFS= read -r -d '' f; do touch -d "@$(git log -1 --format=%ct -- "$f")" "$f"; done
          mkdir _site
          cp -p *.html *.css *.js *.webmanifest *.svg *.png _site/
          cp -rp vendor _site/
          # Version du cache hors ligne = commit : chaque publication déclenche la mise à jour chez les utilisateurs ;
          # empreinte de chaque fichier préchargé : à la mise à jour, seuls les fichiers qui ont changé sont téléchargés.
          node serveur/empreintes.js _site "${GITHUB_SHA::10}"
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
