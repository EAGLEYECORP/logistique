<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Logistique Fret</title>
  <meta name="description" content="Gestion du transport routier international de marchandises : commandes, flotte, chauffeurs, douane, facturation.">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script>try{var t=localStorage.getItem("logistique-theme");if(t==="clair")document.documentElement.dataset.theme="light";if(t==="sombre")document.documentElement.dataset.theme="dark"}catch(e){}</script>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="splash" class="splash" aria-hidden="true"><img src="icon.svg" width="88" height="88" alt=""><strong>Logistique Fret</strong></div>

  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <img src="icon.svg" alt="" width="36" height="36">
        <div><strong>Logistique Fret</strong><span>Transport · Maroc</span></div>
      </div>
      <button class="search-btn" data-act-global="recherche"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Rechercher</span><kbd>⌘K</kbd></button>
      <nav id="nav" aria-label="Navigation principale"></nav>
      <div class="sidebar-foot">
        <span class="dot-online"></span> Données sur cet appareil
      </div>
    </aside>

    <main>
      <header class="topbar">
        <div>
          <h1 id="titre"></h1>
          <p id="soustitre"></p>
        </div>
        <div class="row"><button id="indic-sauvegarde" class="chip" type="button" hidden></button><button class="icon-btn mobile-only" data-act-global="recherche" aria-label="Rechercher"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button><div id="actions" class="row"></div></div>
      </header>
      <div id="app"></div>
    </main>
  </div>

  <nav id="bottombar" class="bottombar" aria-label="Navigation"></nav>

  <dialog id="modale"></dialog>
  <dialog id="palette" aria-label="Recherche"></dialog>
  <dialog id="visionneuse" aria-label="Photo"></dialog>
  <dialog id="assistant" aria-label="Assistant de démarrage"></dialog>
  <button id="fab" class="fab" type="button" hidden></button>
  <div id="toasts" aria-live="polite"></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="data.js"></script>
